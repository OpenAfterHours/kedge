summary: 'A quarterly statutory accrual uplift: extract, compute, approve, apply by statement, re-extract,
  verify, sign off. Four of the seven steps are a person doing something kedge cannot do, so the notebook
  is a runbook rather than a pipeline.'
briefing:
  purpose: Records the quarterly uplift applied to statutory accruals following the reforecast, and evidences
    that the adjustment was applied as approved. The output is the sign-off that Financial Control keeps
    as the control record for the period.
  background: The June reforecast moved the accrual basis for the affected entities from the 2025 rate
    card to the 2026 one. Finance agreed a flat 4.5% uplift as the practical equivalent, to be applied
    to statutory-ledger accruals at the period end only. Management accounts are unaffected.
  cadence: Quarterly, once the reforecast has been agreed at the finance committee.
  audience: Prepared by Financial Control, reviewed by the Head of Statutory Reporting. Control reference
    FC-Q2-2026-014.
  watch_for:
  - One trade carries no accrual value in the source system pending a cost-centre reallocation. Excel
    read the blank as zero and the workbook predicted 0.00 for it; the warehouse left it NULL, so the
    verification step reports it as a break every run until the reallocation happens.
  - Cancelled trades are excluded by the statement, so they must be excluded here too. Four of them sit
    inside the adjusted entities.
  - The workbook's own generated SQL was invalid for the entity whose name contains an apostrophe. This
    notebook renders statements through kedge.sql instead, so its output deliberately differs from the
    spreadsheet's.
  sources:
  - Sign-off!A3:A4 (Purpose)
  - Sign-off!A6:A7 (Background)
  - Sign-off!A12:A13 (Scope)
  - Sign-off!A15:A16 (Known issues)
  - Sign-off!A24:B28 (Sign-off block)
  - Adjustment!G17:G92, read during conversion

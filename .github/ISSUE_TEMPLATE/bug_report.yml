name: Bug report
description: Something kedge did that it should not have, or did not do that it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, do not file it here — see
        [SECURITY.md](https://github.com/OpenAfterHours/kedge/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        `kedge inspect quarterly.xlsx` ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of "uv run kedge doctor --json"
      description: >-
        This answers most of the environment questions in one go — Python, the marimo pin, which
        config files were found, whether the keyring resolves, and any markers left by a crashed
        run. It prints no API key and no workbook content, but it does print local paths, so
        redact those if you would rather not share them. Add `--no-network` to skip the endpoint
        probe.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: kedge version
      description: "`uv run kedge --version`, if `doctor` would not run at all."
      placeholder: "kedge 0.0.3 (marimo pin 0.23.15)"

  - type: textarea
    id: workbook
    attributes:
      label: The workbook, if one is involved
      description: >-
        Do not attach a real one. Its shape is what matters: how many sheets, roughly how many
        rows, whether it carries Power Query or external connections, whether Excel last saved it
        (a workbook written by a tool has no cached values). If the analyser produced a
        `Finding`, paste it.

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or log output
      description: >-
        The whole traceback, not the last line. `--verbose` is a global option, so
        `kedge --verbose inspect ...` re-runs the same command logging at DEBUG.
      render: text
